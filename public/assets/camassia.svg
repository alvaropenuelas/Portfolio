      <stop offset="0%" stop-color="#031520"/>
      <stop offset="50%" stop-color="#061e2a"/>
      <stop offset="100%" stop-color="#082418"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
