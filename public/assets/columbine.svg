<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04100a"/>
      <stop offset="50%" stop-color="#061620"/>
      <stop offset="100%" stop-color="#031020"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0F6E56" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F6E56" stop-opacity="0"/>
    </radialGradient>
    <!-- net/trawl pattern via repeating small diamonds -->
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- net grid diagonal lines -->
  <g opacity="0.09" stroke="#1D9E75" stroke-width="0.6">
    <line x1="0"   y1="0"   x2="400"  y2="800"/>
    <line x1="100" y1="0"   x2="500"  y2="800"/>
    <line x1="200" y1="0"   x2="600"  y2="800"/>
    <line x1="300" y1="0"   x2="700"  y2="800"/>
    <line x1="400" y1="0"   x2="800"  y2="800"/>
    <line x1="500" y1="0"   x2="900"  y2="800"/>
    <line x1="600" y1="0"   x2="1000" y2="800"/>
    <line x1="700" y1="0"   x2="1100" y2="800"/>
    <line x1="800" y1="0"   x2="1200" y2="800"/>
    <line x1="900" y1="0"   x2="1300" y2="800"/>
    <line x1="1000" y1="0"  x2="1400" y2="800"/>
    <!-- reverse diagonals -->
    <line x1="0"   y1="800" x2="400"  y2="0"/>
    <line x1="100" y1="800" x2="500"  y2="0"/>
    <line x1="200" y1="800" x2="600"  y2="0"/>
    <line x1="300" y1="800" x2="700"  y2="0"/>
    <line x1="400" y1="800" x2="800"  y2="0"/>
    <line x1="500" y1="800" x2="900"  y2="0"/>
    <line x1="600" y1="800" x2="1000" y2="0"/>
    <line x1="700" y1="800" x2="1100" y2="0"/>
    <line x1="800" y1="800" x2="1200" y2="0"/>
    <line x1="900" y1="800" x2="1300" y2="0"/>
  </g>
  <!-- declining trend line (fisheries depletion) -->
  <path d="M80,180 Q300,200 500,280 Q700,360 900,450 Q1050,510 1150,580" fill="none" stroke="#5DCAA5" stroke-width="1.8" opacity="0.35" stroke-dasharray="6,4"/>
  <!-- species dots along timeline (declining) -->
  <circle cx="80"   cy="180" r="4"   fill="#5DCAA5" opacity="0.7"/>
  <circle cx="200"  cy="195" r="3.5" fill="#5DCAA5" opacity="0.65"/>
  <circle cx="320"  cy="225" r="3"   fill="#5DCAA5" opacity="0.6"/>
  <circle cx="440"  cy="262" r="3.5" fill="#5DCAA5" opacity="0.6"/>
  <circle cx="560"  cy="310" r="3"   fill="#5DCAA5" opacity="0.55"/>
  <circle cx="680"  cy="365" r="2.5" fill="#5DCAA5" opacity="0.5"/>
  <circle cx="800"  cy="415" r="2"   fill="#5DCAA5" opacity="0.45"/>
  <circle cx="920"  cy="458" r="2.5" fill="#5DCAA5" opacity="0.45"/>
  <circle cx="1040" cy="510" r="2"   fill="#5DCAA5" opacity="0.4"/>
  <circle cx="1140" cy="575" r="1.5" fill="#5DCAA5" opacity="0.35"/>
  <!-- secondary species (less depleted) -->
  <path d="M80,250 Q350,258 600,275 Q850,292 1150,310" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>
  <!-- FAO area boundary boxes -->
  <rect x="40"  y="100" width="520" height="600" rx="2" fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.12"/>
  <rect x="620" y="100" width="540" height="600" rx="2" fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.12"/>
</svg>
