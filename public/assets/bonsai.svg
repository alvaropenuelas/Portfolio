<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020b14"/>
      <stop offset="60%" stop-color="#071a2b"/>
      <stop offset="100%" stop-color="#0a2a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#0F6E56" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F6E56" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- sonar rings centered roughly mid-left -->
  <circle cx="480" cy="400" r="60"  fill="none" stroke="#1D9E75" stroke-width="1.2" opacity="0.35"/>
  <circle cx="480" cy="400" r="130" fill="none" stroke="#1D9E75" stroke-width="0.9" opacity="0.22"/>
  <circle cx="480" cy="400" r="210" fill="none" stroke="#1D9E75" stroke-width="0.7" opacity="0.14"/>
  <circle cx="480" cy="400" r="310" fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.09"/>
  <circle cx="480" cy="400" r="430" fill="none" stroke="#1D9E75" stroke-width="0.3" opacity="0.06"/>
  <!-- crosshair -->
  <line x1="480" y1="340" x2="480" y2="460" stroke="#5DCAA5" stroke-width="0.6" opacity="0.3"/>
  <line x1="420" y1="400" x2="540" y2="400" stroke="#5DCAA5" stroke-width="0.6" opacity="0.3"/>
  <!-- signal dot -->
  <circle cx="480" cy="400" r="4.5" fill="#5DCAA5" opacity="0.9"/>
  <!-- scattered occurrence blips -->
  <circle cx="620" cy="310" r="3"   fill="#5DCAA5" opacity="0.55"/>
  <circle cx="380" cy="250" r="2.5" fill="#5DCAA5" opacity="0.45"/>
  <circle cx="710" cy="460" r="2"   fill="#5DCAA5" opacity="0.4"/>
  <circle cx="320" cy="510" r="3.5" fill="#5DCAA5" opacity="0.5"/>
  <circle cx="840" cy="360" r="2"   fill="#5DCAA5" opacity="0.35"/>
  <circle cx="200" cy="420" r="2"   fill="#5DCAA5" opacity="0.35"/>
  <circle cx="900" cy="220" r="1.5" fill="#5DCAA5" opacity="0.3"/>
  <circle cx="560" cy="560" r="2.5" fill="#5DCAA5" opacity="0.4"/>
  <!-- subtle latitude grid lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
  <line x1="300" y1="0"  x2="300" y2="800" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
  <line x1="600" y1="0"  x2="600" y2="800" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
  <line x1="900" y1="0"  x2="900" y2="800" stroke="#1D9E75" stroke-width="0.3" opacity="0.12"/>
</svg>
