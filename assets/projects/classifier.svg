    <circle cx="100" cy="100" r="8"/><circle cx="100" cy="150" r="8"/><circle cx="100" cy="200" r="8"/><circle cx="100" cy="250" r="8"/>
    <!-- Hidden layer 1 -->
    <circle cx="220" cy="115" r="8"/><circle cx="220" cy="165" r="8"/><circle cx="220" cy="215" r="8"/>
    <!-- Hidden layer 2 -->
    <circle cx="340" cy="130" r="8"/><circle cx="340" cy="180" r="8"/><circle cx="340" cy="230" r="8"/>
    <!-- Output -->
    <circle cx="430" cy="175" r="10"/>
    <!-- Connections (selected) -->
    <line x1="108" y1="100" x2="212" y2="115" opacity="0.5"/>
    <line x1="108" y1="100" x2="212" y2="165"/>
    <line x1="108" y1="150" x2="212" y2="115"/>
    <line x1="108" y1="150" x2="212" y2="215"/>
    <line x1="108" y1="200" x2="212" y2="165" opacity="0.5"/>
    <line x1="108" y1="250" x2="212" y2="215"/>
    <line x1="228" y1="115" x2="332" y2="130"/>
    <line x1="228" y1="165" x2="332" y2="180"/>
    <line x1="228" y1="215" x2="332" y2="230"/>
    <line x1="228" y1="115" x2="332" y2="180" opacity="0.4"/>
    <line x1="348" y1="130" x2="420" y2="175"/>
    <line x1="348" y1="180" x2="420" y2="175"/>
    <line x1="348" y1="230" x2="420" y2="175" opacity="0.5"/>
