  <!-- Highlighted active nodes -->
  <circle cx="220" cy="165" r="8" fill="#0d5a3e" stroke="#5DCAA5" stroke-width="1.5" opacity="0.9"/>
  <circle cx="340" cy="180" r="8" fill="#0d5a3e" stroke="#5DCAA5" stroke-width="1.5" opacity="0.9"/>
  <circle cx="430" cy="175" r="10" fill="#0F6E56" stroke="#5DCAA5" stroke-width="2" opacity="0.9"/>
